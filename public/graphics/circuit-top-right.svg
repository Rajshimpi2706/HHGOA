<svg width="350" height="300" viewBox="0 0 350 300" fill="none" xmlns="http://www.w3.org/http://www.w3.org/2000/svg">
  <!-- Circuit paths in top right -->
  <!-- Main horizontal path bending down-left -->
  <path d="M 350 50 L 220 50 L 160 110 L 80 110" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" fill="none" />
  <circle cx="80" cy="110" r="4.5" fill="#0B0D12" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5" />

  <!-- Bending path 2 -->
  <path d="M 350 80 L 250 80 L 190 140 L 130 140 L 110 160" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.8" fill="none" />
  <circle cx="110" cy="160" r="3.5" fill="#0B0D12" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Vertical path from top bending left -->
  <path d="M 310 0 L 310 65 L 290 85" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" fill="none" />
  <circle cx="290" cy="85" r="3" fill="#0B0D12" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Bending path 4 -->
  <path d="M 350 120 L 280 120 L 220 180 L 220 230" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.8" fill="none" />
  <circle cx="220" cy="230" r="4" fill="#0B0D12" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
</svg>
